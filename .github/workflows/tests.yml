name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  flutter-tests:
    name: Flutter Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get
        working-directory: task_manager_flutter

      - name: Flutter analyze
        run: flutter analyze
        working-directory: task_manager_flutter

      - name: Flutter test
        run: flutter test --coverage
        working-directory: task_manager_flutter

      - name: Flutter test — cenario de producao (context-path /boletobancos)
        # Regressao do incidente P0 2026-08-21: sem este dart-define, o teste
        # dedicado (api_links_production_context_path_test.dart) roda com o
        # backend local (http) e nao exercita o ramo https real. Ver
        # comentario no topo do arquivo de teste.
        run: >
          flutter test
          --dart-define=BACKEND_URL=https://appacademia-production-be7e.up.railway.app
          test/utils/api_links_production_context_path_test.dart
        working-directory: task_manager_flutter

  android-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    needs: flutter-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: task_manager_flutter

      - name: Flutter pub get
        run: flutter pub get
        working-directory: task_manager_flutter

      - name: Run Android tests via Fastlane
        run: bundle exec fastlane android tests
        working-directory: task_manager_flutter

  ios-tests:
    name: iOS Unit Tests
    runs-on: macos-latest
    needs: flutter-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: task_manager_flutter

      - name: Flutter pub get
        run: flutter pub get
        working-directory: task_manager_flutter

      - name: Run iOS tests via Fastlane
        run: bundle exec fastlane ios tests
        working-directory: task_manager_flutter
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID:       ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: fastlane/AuthKey.p8
          MATCH_GIT_URL:   ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:  ${{ secrets.MATCH_PASSWORD }}
